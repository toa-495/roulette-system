<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>録画の動作確認</title>
<style>[hidden]{display:none!important}body{font:16px/1.7 system-ui,sans-serif;max-width:740px;margin:32px auto;padding:0 20px;color:#24334a;background:#f6f5ef}button,a{display:inline-block;padding:12px 18px;border:1px solid #274a61;border-radius:12px;background:#274a61;color:white}video{width:100%;max-height:65vh;display:block;margin-top:20px}#status{white-space:pre-wrap}small{display:block;margin:15px 0}</style>
<h1>録画の動作確認</h1><p>架空の予定で、丸いカード枠と保存動画の効果音を確認します。アカウントや予定データには接続しません。</p>
<label>参加人数 <select id="people"><option value="1">1人（短いタイトルと説明）</option><option value="3" selected>3人（複数のカード）</option></select></label><br>
<button id="run">テスト動画を作成</button><p id="status" role="status">開始すると約15〜25秒で結果を表示します。（集合・効果音 v8）</p><video id="clip" controls playsinline hidden></video><a id="download" hidden>テスト動画を保存</a>
<script type="module">
import {startRecording} from '../recording.js?v=20261120-finale1';
import {soundOn,toggleSound} from '../wheel.js?v=20261120-finale1';
const button=document.getElementById('run'),status=document.getElementById('status'),clip=document.getElementById('clip');
button.onclick=async()=>{
  const count=Number(document.getElementById('people').value);
  const sample=count===1?[['a','Aki','朝']]:[['a','Aki','湖畔を散歩'],['b','Haru','カフェでひと休み'],['c','Sora','紅葉を見に行こう']];
  const spinAt=1000+(count-1)*3000+3500,resultAt=spinAt+2500;
  button.disabled=true;status.textContent='記録中：'+count+'人の開示→ルーレット→決定を保存します。';
  const wasOn=soundOn();if(!wasOn) toggleSound();
  let epoch,base;
  const read=()=>{
    const elapsed=epoch===undefined?-10000:performance.now()-epoch;
    const people=sample.map(([userId,name,title],i)=>({userId,name,openedAt:(base || 0)+1000+i*3000,
      proposal:elapsed>=1000+i*3000?{userId,title,rich:count===1?'<p>散歩</p>':'<p>'+name+'さんの予定です。</p>',locations:[],links:[]}:null}));
    const spin=elapsed>=spinAt?{id:'sample-spin',startAt:base+spinAt,duration:2500,turns:3,angle:.5,winnerId:count===1?'a':'b',candidates:sample.map(([userId,name,title])=>({userId,name,title}))}:null;
    return {eventTitle:'録画テスト',slotTitle:count+'人の開示と抽選',people,focusId:elapsed>=7000?'c':elapsed>=4000?'b':'a',spin,
      spinning:!!spin && elapsed<resultAt,winner:elapsed>=resultAt?people[count===1?0:1]:null,serverNow:Date.now(),
      revealProgress:Object.fromEntries(people.map((person,i)=>[person.userId,Math.max(0,Math.min(1,(elapsed-1000-i*3000)/2400))]))};
  };
  try {
    await startRecording({read,onReady:async({blob,extension,reason,diagnostics})=>{
      if(!wasOn) toggleSound();
      const url=URL.createObjectURL(blob);clip.src=url;clip.hidden=false;
      const download=document.getElementById('download');download.href=url;download.download='recording-check.'+extension;download.hidden=false;
      try {
        await new Promise((resolve,reject)=>{clip.onloadedmetadata=resolve;clip.onerror=reject;});
        if(!Number.isFinite(clip.duration) || clip.duration<resultAt/1000+3) throw new Error('再生時間が短すぎます：'+clip.duration+'秒 / '+reason+' / '+JSON.stringify(diagnostics));
        const canvas=document.createElement('canvas');canvas.width=720;canvas.height=1280;const g=canvas.getContext('2d');
        const checks=[];
        const times=count===1?[.2,2,4,6,8]:[.2,2,5,8,12,14];
        for(const time of times) {
          await new Promise((resolve,reject)=>{clip.onseeked=resolve;clip.onerror=reject;clip.currentTime=time;});
          g.drawImage(clip,0,0,720,1280);
          let cards=0;
          const positions=count===1?[[130,208]]:[[130,208],[450,208],[130,352]];
          for(const [x,y] of positions) {
            const pixels=g.getImageData(x,y+(time>=resultAt/1000+.5?198:0),160,26).data;let ink=0;
            for(let i=0;i<pixels.length;i+=4) if(pixels[i]+pixels[i+1]+pixels[i+2]<400) ink++;
            if(ink>15) cards++;
          }
          checks.push(cards);
        }
        let audioResult='音声の計測は未実行';
        try {
          const audio=new AudioContext();const decoded=await audio.decodeAudioData(await blob.arrayBuffer());const samples=decoded.getChannelData(0),rate=decoded.sampleRate;
          const offsets=[];
          for(const [index,expected] of (count===1?[1]:[1,4,7]).entries()) {
            const [x,y]=[[130,242],[450,242],[130,386]][index];
            const seek=async time=>{await new Promise((resolve,reject)=>{clip.onseeked=resolve;clip.onerror=reject;clip.currentTime=time;});g.drawImage(clip,0,0,720,1280);};
            const ink=()=>{const pixels=g.getImageData(x,y,200,24).data;let count=0;for(let i=0;i<pixels.length;i+=4) if(pixels[i]+pixels[i+1]+pixels[i+2]<480) count++;return count;};
            await seek(.2);const before=ink();let visible=null;
            for(let t=expected-.25;t<expected+1.2;t+=.05) {await seek(t);if(ink()<before*.4){visible=t;break;}}
            if(visible===null) throw new Error('映像の開示開始を検出できませんでした。');
            let found=null;
            for(let t=visible-.4;t<visible+.4;t+=.01) {
              let energy=0;const start=Math.floor(t*rate),length=Math.floor(rate*.01);
              for(let i=0;i<length;i++) energy+=(samples[start+i] || 0)**2;
              if(Math.sqrt(energy/length)>.007) {found=t;break;}
            }
            offsets.push(found===null?null:Math.round((found-visible)*1000));
          }
          await audio.close();audioResult='音声検証 合格：映像に対する開示音のずれ(ms) '+offsets.map(offset=>offset===null?'未検出':offset).join(', ');
          if(offsets.some(offset=>offset===null || Math.abs(offset)>150)) throw new Error(audioResult.replace('合格','要確認'));
        } catch(error) {audioResult='音声計測：'+error.message;}
        status.textContent=(checks.every(cards=>cards===count)?'映像検証 合格':'映像検証 要確認')+'：'+times.length+'場面の人数 '+checks.join(', ')+'\n'+audioResult+'\n'+clip.videoWidth+'×'+clip.videoHeight+' / '+blob.type+' / '+blob.size+' bytes';
        clip.currentTime=resultAt/1000+1;
      } catch(error) {status.textContent='保存動画の確認でエラー：'+error.message;}
      button.disabled=false;
    },onError:error=>{status.textContent=error.message;button.disabled=false;},onStop(){}});
    base=Date.now();epoch=performance.now();
  } catch(error) {if(!wasOn && soundOn()) toggleSound();status.textContent=error.message;button.disabled=false;}
};
</script></html>
